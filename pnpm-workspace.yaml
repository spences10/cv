packages:
  - .

minimumReleaseAge: 2880

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest@*: 5.0.3

peerDependencyRules:
  allowedVersions:
    # Vite+ core exposes Vite 8 APIs under Vite+'s package version.
    vite: 1.1.0
minimumReleaseAgeExclude:
  # Renovate security update: vite-plus@1.3.0
  - vite-plus@1.3.0
